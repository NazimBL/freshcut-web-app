{% extends 'base.html' %}

{% block content %}
<section class="py-5">
    <div class="container">
        <h2 class="text-primary mb-4">Manage Working Hours</h2>

        <div class="card bg-secondary text-white border-0 shadow">
            <div class="card-body">
                <form method="POST">
                    <table class="table table-dark table-striped">
                        <thead>
                            <tr>
                                <th>Day</th>
                                <th>Start Time</th>
                                <th>End Time</th>
                                <th>Closed?</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for av, day in availabilities %}
                            <tr>
                                <td>{{ day }}</td>
                                <td><input type="time" name="start_time_{{ av.id }}"
                                        value="{{ av.start_time.strftime('%H:%M') }}"
                                        class="form-control bg-dark text-white border-0"></td>
                                <td><input type="time" name="end_time_{{ av.id }}"
                                        value="{{ av.end_time.strftime('%H:%M') }}"
                                        class="form-control bg-dark text-white border-0"></td>
                                <td>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input" type="checkbox" name="is_closed_{{ av.id }}" {%
                                            if av.is_closed %}checked{% endif %}>
                                    </div>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                    <button type="submit" class="btn btn-primary mt-3">Save Changes</button>
                    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-light mt-3 ms-2">Back to
                        Dashboard</a>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
