{% extends 'base.html' %}

{% block content %}
<section class="py-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card bg-secondary text-white border-0 shadow">
                <div class="card-body p-4">
                    <h3 class="text-center text-primary mb-4">Admin Login</h3>
                    <form method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="username"
                                name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control bg-dark text-white border-secondary"
                                id="password" name="password" required>
                        </div>
                        {% with messages = get_flashed_messages() %}
                        {% if messages %}
                        <div class="alert alert-danger py-2">{{ messages[0] }}</div>
                        {% endif %}
                        {% endwith %}
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary">Login</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
