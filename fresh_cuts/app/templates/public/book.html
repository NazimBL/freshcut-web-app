{% extends 'base.html' %}

{% block content %}
<section class="py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 bg-secondary">
                <div class="card-body p-5">
                    <h2 class="section-title text-center text-primary mb-4">Book Your Cut</h2>
                    <form action="{{ url_for('main.book') }}" method="POST">

                        <div class="mb-3">
                            <label for="service_id" class="form-label">Select Service</label>
                            <select class="form-select bg-dark text-white border-secondary" id="service_id"
                                name="service_id" required>
                                {% for service in services %}
                                <option value="{{ service.id }}" {% if request.args.get('service_id')|int==service.id
                                    %}selected{% endif %}>
                                    {{ service.name }} - ${{ service.price }}
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="date" class="form-label">Date</label>
                            <input type="date" class="form-control bg-dark text-white border-secondary" id="date"
                                name="date" required>
                        </div>

                        <div class="mb-3">
                            <label for="time" class="form-label">Time</label>
                            <input type="time" class="form-control bg-dark text-white border-secondary" id="time"
                                name="time" min="09:00" max="20:00" required>
                            <div class="form-text text-muted">Hours: 9:00 AM - 8:00 PM</div>
                        </div>

                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="name"
                                name="name" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control bg-dark text-white border-secondary" id="email"
                                name="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="tel" class="form-control bg-dark text-white border-secondary" id="phone"
                                name="phone" required>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">Confirm Booking</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
