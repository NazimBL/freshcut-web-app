{% extends 'base.html' %}

{% block content %}
<section class="py-5">
    <div class="container">
        <h2 class="section-title text-center mb-5">Menu of Services</h2>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card bg-secondary text-white border-0 shadow-lg p-4">
                    <div class="card-body">
                        {% for service in services %}
                        <div class="mb-4 pb-3 border-bottom border-dark service-item">
                            <div class="d-flex justify-content-between align-items-baseline mb-2">
                                <h4 class="text-primary mb-0 font-playfair">{{ service.name }}</h4>
                                <span class="fs-5 fw-bold">${{ service.price }}</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <p class="text-muted mb-0 small">{{ service.description }}</p>
                                <a href="{{ url_for('main.book', service_id=service.id) }}"
                                    class="btn btn-sm btn-outline-light ms-3">Book</a>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <div class="text-center mt-5">
                    <p class="text-muted">Prices may vary based on hair length and complexity.</p>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
    .font-playfair {
        font-family: 'Playfair Display', serif;
    }

    .service-item:last-child {
        border-bottom: none !important;
        margin-bottom: 0 !important;
        padding-bottom: 0 !important;
    }
</style>
{% endblock %}
